name: ProLign CI

# Trigger schedule (see qa/TEST_PLAN.md §9 for the rationale behind each):
#   - pull_request into main: fast feedback — unit + API + AI-service tests,
#     coverage gate, critical-path E2E. This is the PR quality gate.
#   - push to main: same suite, full run, after merge.
#   - nightly schedule: full regression across everything, including E2E,
#     independent of whether anything changed that day.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly full regression

jobs:
  frontend-unit:
    name: Frontend unit/component tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-reports
          path: frontend/reports/

  backend-api:
    name: Backend API tests (Supertest) + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Backend API tests run against mongodb-memory-server (an in-process,
      # downloaded-on-demand Mongo binary) — no external DB service needed.
      # MONGO_URI/NODE_ENV come from test/globalSetup.js at runtime, overriding
      # these. The rest are dummy, non-secret values: config/env.js's
      # validateEnv() only requires them to be non-empty, JWT signing just needs
      # *a* consistent string, and test/setup.js:27 mocks services/emailService.js
      # for the whole suite, so EMAIL_* is never used to reach a real SMTP host.
      - run: npm run test:coverage
        env:
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-not-for-production
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: "587"
          EMAIL_USER: ci@example.test
          EMAIL_PASS: ci-test-password
          EMAIL_FROM: ci@example.test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-api-reports
          path: backend/reports/

  ai-services:
    name: AI service tests (pytest) + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # AI_interviewer's own requirements.txt is NOT sufficient on its own:
          # main.py -> api/routes.py -> mm_services.matching_service -> matcher.py
          # imports pandas/numpy at module level, and services/interview_service.py
          # imports datacleaning (also pandas) from the sibling Mentor_Mentee_Match/
          # directory. Without installing that second requirements file, `from main
          # import app` fails at collection with ModuleNotFoundError before any
          # test runs. Mentor_Mentee_Match/requirements.txt no longer includes
          # torch/sentence-transformers (matcher.py has a lexical fallback,
          # confirmed by reading it) — this leg needs no torch install at all.
          - service: AI_interviewer
            extra_requirements: ../Mentor_Mentee_Match/requirements.txt
            test_requirements: requirements-test.txt
            needs_torch: false
          # Neither service's requirements.txt carries test-only deps anymore
          # (pytest/mongomock(-motor)/respx now live in each leg's own
          # requirements-test.txt) — split out so the runtime Docker image
          # (which only installs requirements.txt) never ships them.
          - service: 'Rag_Chatbot/app'
            extra_requirements: ''
            test_requirements: ../requirements-test.txt
            needs_torch: true
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # CPU-only torch first, from PyTorch's own index, only where it's
      # actually needed. Rag_Chatbot's requirements.txt pulls it in transitively
      # via sentence-transformers==3.3.1; letting pip resolve it normally
      # downloads the ~2GB CUDA build instead of the ~900MB CPU one.
      - if: matrix.needs_torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt -r "${{ matrix.test_requirements }}"
      - name: Install extra app dependencies (AI_interviewer only)
        if: matrix.extra_requirements != ''
        run: pip install -r "${{ matrix.extra_requirements }}"
      # Both services mock their real dependencies at the conftest.py level —
      # AI_interviewer/conftest.py patches pymongo.MongoClient with mongomock,
      # Rag_Chatbot/app/conftest.py patches AsyncIOMotorClient with
      # mongomock-motor, and respx (a declared test dependency in both
      # requirements.txt) intercepts outbound Groq HTTP calls. So config.py's
      # _required() checks only need non-empty strings, never a working
      # credential — no GitHub repo secrets are needed for this job at all.
      - run: pytest
        env:
          GROQ_API_KEY: ci-test-groq-key-not-real
          MONGO_URI: mongodb://localhost:27017/ci-unused
          SLACK_WEBHOOK_URL: https://hooks.slack.example.test/ci-unused
          SLACK_COMPLAINT_WEBHOOK_URL: https://hooks.slack.example.test/ci-unused
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/reports/

  e2e:
    name: End-to-end tests (Playwright)
    # Full stack required (real frontend + backend + Mongo) — this is the
    # slowest job, so it only runs on PR/merge, not on every local push.
    runs-on: ubuntu-latest
    needs: [frontend-unit, backend-api]
    if: github.event_name != 'schedule'
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && npm ci
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      # Start the backend in the background before Playwright's webServer
      # brings up the frontend dev server. NODE_ENV is deliberately left unset
      # (defaults to "development", config/env.js:34) — the dev-only test-helper
      # routes that global-setup.js/global-teardown.js depend on are only
      # mounted when NODE_ENV !== "production" (server.js:130-132).
      - run: cd backend && npm run dev &
        env:
          MONGO_URI: mongodb://localhost:27017/prolign_ci
          # Same rationale as backend-api: non-secret placeholders. JWT signing
          # only needs *a* consistent string, and this job never sends real
          # email (no test exercises the email flow through to a real SMTP host).
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-not-for-production
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: "587"
          EMAIL_USER: ci@example.test
          EMAIL_PASS: ci-test-password
          EMAIL_FROM: ci@example.test
      # Backgrounding with `&` starts the process but does not confirm it's
      # actually serving — config/env.js would process.exit(1) before binding
      # a port if any required var were missing, and the next step would then
      # fail on every request with no useful signal about why. Poll the real
      # health endpoint instead of assuming readiness.
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health >/dev/null 2>&1; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time." >&2
          exit 1
      - run: cd frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: frontend/reports/
