name: ProLign CI

# Trigger schedule (see qa/TEST_PLAN.md §9 for the rationale behind each):
#   - pull_request into main: fast feedback — unit + API + AI-service tests,
#     coverage gate, critical-path E2E. This is the PR quality gate.
#   - push to main: same suite, full run, after merge.
#   - nightly schedule: full regression across everything, including E2E,
#     independent of whether anything changed that day.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly full regression

jobs:
  frontend-unit:
    name: Frontend unit/component tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-reports
          path: frontend/reports/

  backend-api:
    name: Backend API tests (Supertest) + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Backend API tests run against mongodb-memory-server (an in-process,
      # downloaded-on-demand Mongo binary) — no external DB service needed.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-api-reports
          path: backend/reports/

  ai-services:
    name: AI service tests (pytest) + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [AI_interviewer, 'Rag_Chatbot/app']
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ../requirements.txt || pip install -r requirements.txt
      # NOTE: both services' config.py require real secrets (GROQ_API_KEY,
      # MONGO_URI, SLACK_WEBHOOK_URL, etc.) to import at all — set these as
      # repository secrets before this job will actually pass in CI. They are
      # intentionally NOT hardcoded here.
      - run: pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COMPLAINT_WEBHOOK_URL: ${{ secrets.SLACK_COMPLAINT_WEBHOOK_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/reports/

  e2e:
    name: End-to-end tests (Playwright)
    # Full stack required (real frontend + backend + Mongo) — this is the
    # slowest job, so it only runs on PR/merge, not on every local push.
    runs-on: ubuntu-latest
    needs: [frontend-unit, backend-api]
    if: github.event_name != 'schedule'
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd backend && npm ci
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      # Start the backend in the background before Playwright's webServer
      # brings up the frontend dev server.
      - run: cd backend && npm run dev &
        env:
          MONGO_URI: mongodb://localhost:27017/prolign_ci
          # ...remaining backend secrets (JWT_SECRET, EMAIL_*, etc.) — see
          # backend/.env for the full required list, set as repo secrets.
      - run: cd frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: frontend/reports/
