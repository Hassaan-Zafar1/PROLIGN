# ECS variant of deploy/edge.nginx.conf — same routing logic, different
# upstream syntax. The ECS task definition (Phase 3.5) uses `awsvpc` network
# mode, where all 4 containers in the task share ONE elastic network
# interface and reach each other via 127.0.0.1:<port> — there is no
# service-name DNS resolution between them the way Docker Compose's own
# bridge network provides it. That's the only reason this file exists
# separately from edge.nginx.conf; if you change routing behavior, change it
# in both files identically.
#
#   /api/*          -> Express      (already mounted at /api in server.js)
#   /interviewer/*  -> FastAPI      (main.py mounts its router at /interviewer)
#   /rag/*          -> FastAPI      (main.py mounts its router at /rag)
#
# No frontend upstream — the SPA is on Vercel (https://prolign.vercel.app).

upstream prolign_backend        { server 127.0.0.1:5000; }
upstream prolign_interviewer    { server 127.0.0.1:8000; }
upstream prolign_rag            { server 127.0.0.1:8001; }

server {
    listen 80;
    server_name _;

    # Audio answers are posted to /interviewer/sessions/{id}/transcribe and CV
    # uploads allow 5 MB (middleware/cvUpload.js). nginx's 1 MB default would
    # reject both with a 413.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location /api/ {
        proxy_pass http://prolign_backend;
    }

    # Stripe posts here directly. express.json's verify hook stashes req.rawBody
    # for signature checking (server.js:51-53), so the body must not be altered.
    location = /api/payments/webhook {
        proxy_pass http://prolign_backend;
        proxy_request_buffering off;
    }

    # Exact-match locations alongside the prefix ones: a request for
    # /interviewer (no trailing slash) doesn't match the /interviewer/ prefix
    # block below, so both forms are wired up explicitly.
    location = /interviewer { proxy_pass http://prolign_interviewer; }
    location /interviewer/ {
        proxy_pass http://prolign_interviewer;
        # POST /chat fans out to Groq at least twice plus a local embed, and the
        # Groq client's own timeout is 45s (clients/groq_client.py:25).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /rag { proxy_pass http://prolign_rag; }
    location /rag/ {
        proxy_pass http://prolign_rag;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # No SPA served here — the frontend is on Vercel. This stub gives a clear
    # signal on the bare root instead of a confusing 404, and doubles as a
    # simple liveness check for `edge` itself, separate from the 3 backend
    # services' own /health endpoints — this is what CloudFront's origin
    # health/default behavior hits (Phase 3.6).
    location = / {
        default_type text/plain;
        return 200 "prolign edge: up. Frontend is served separately by Vercel (https://prolign.vercel.app).\n";
    }
}
