# Local stand-in for the routing the ECS task's edge container does in
# deploy/edge.ecs.nginx.conf. Deliberately does NO path rewriting — ECS's edge
# container can't rewrite paths any more than this one does, so each service
# owns its own prefix:
#
#   /api/*          -> Express      (already mounted at /api in server.js)
#   /interviewer/*  -> FastAPI      (main.py mounts its router at /interviewer)
#   /rag/*          -> FastAPI      (main.py mounts its router at /rag)
#
# No frontend upstream here on purpose — the SPA deploys to Vercel
# (https://prolign.vercel.app), not into this compose stack. Local frontend
# testing means running `npm run dev` separately, pointed at this stack's
# :8080. Keeping this file rewrite-free is what makes "works in compose" mean
# "works in the ECS task" — the ONLY difference between this file and
# edge.ecs.nginx.conf is the upstream target syntax (service-name DNS here vs.
# 127.0.0.1 there, per each environment's networking model), never the routing
# logic itself.

upstream prolign_backend        { server backend:5000; }
upstream prolign_interviewer    { server ai-interviewer:8000; }
upstream prolign_rag            { server rag-chatbot:8001; }

server {
    listen 80;
    server_name _;

    # Audio answers are posted to /interviewer/sessions/{id}/transcribe and CV
    # uploads allow 5 MB (middleware/cvUpload.js). nginx's 1 MB default would
    # reject both with a 413.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location /api/ {
        proxy_pass http://prolign_backend;
    }

    # Stripe posts here directly. express.json's verify hook stashes req.rawBody
    # for signature checking (server.js:51-53), so the body must not be altered.
    location = /api/payments/webhook {
        proxy_pass http://prolign_backend;
        proxy_request_buffering off;
    }

    # Exact-match locations alongside the prefix ones: a request for
    # /interviewer (no trailing slash) doesn't match the /interviewer/ prefix
    # block below, so both forms are wired up explicitly.
    location = /interviewer { proxy_pass http://prolign_interviewer; }
    location /interviewer/ {
        proxy_pass http://prolign_interviewer;
        # POST /chat fans out to Groq at least twice plus a local embed, and the
        # Groq client's own timeout is 45s (clients/groq_client.py:25).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /rag { proxy_pass http://prolign_rag; }
    location /rag/ {
        proxy_pass http://prolign_rag;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # No SPA served here — the frontend is on Vercel. This stub exists so
    # hitting the bare root during local testing gives a clear signal instead
    # of a confusing 404, and doubles as a simple liveness check for `edge`
    # itself (distinct from the 3 backend services' own /health endpoints).
    location = / {
        default_type text/plain;
        return 200 "prolign edge: up. Frontend is served separately by Vercel (https://prolign.vercel.app).\n";
    }
}
